# Updates the Google Scholar citation badge on the homepage once a day.
# The numbers are written to the `google-scholar-stats` branch (results/*.json); the badge in
# _pages/about.md reads gs_data_shieldsio.json from there through shields.io.
# If Google Scholar blocks a run, the job fails and the last good numbers stay in place.
name: Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  push:
    branches: [master]
    paths:
      - google_scholar_crawler/**
      - .github/workflows/google_scholar_crawler.yaml

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        env:
          GOOGLE_SCHOLAR_ID: y-gvXecAAAAJ
        run: python google_scholar_crawler/main.py
      - name: Publish to the google-scholar-stats branch
        run: |
          cd results
          git init -q -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update Google Scholar citation data"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" google-scholar-stats
